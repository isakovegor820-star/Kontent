# CI: линт, сборка и тесты на каждый push в main и каждый pull request.
# Секреты не нужны — для шага build даём заглушки, чтобы статический пререндер
# не падал без реальных значений (пулы БД/Redis ленивые и при сборке не подключаются).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurora_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Заглушки для сборки. Значения заведомо фейковые — на сборке живые сервисы
    # не поднимаются (getPool/getRedis вызываются только внутри запросов).
    env:
      DATABASE_URL: "postgres://user:pass@localhost:5432/db"
      REDIS_URL: "redis://127.0.0.1:6380"
      TG_BOT_TOKEN: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      TG_BOT_USERNAME: "aurora_test_bot"
      TG_CHAT_ID: "-1000000000000"
      AI_API_KEY: "test-key"
      AI_DAILY_LIMIT: "30"
      MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_migration_test"
      E2E_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_e2e_real"
      E2E_REDIS_URL: "redis://127.0.0.1:6380/15"
      MIGRATION_TEST_REDIS_URL: "redis://127.0.0.1:6380/14"
      # Мастер-ключ шифрования токенов сообществ (VK). В CI — заглушка: тесты
      # token-crypto выставляют своё значение, а на сборке шифрование не вызывается.
      TOKENS_MASTER_KEY: "ci-test-master-key-not-for-prod"
      TOKENS_KEY_ID: "1"
      VK_APP_ID: "0"
      VK_APP_SECRET: "test-vk-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install PDF verification utilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils

      - name: Install PostgreSQL 17 cluster and backup tools
        run: |
          # The runner's preinstalled PG16 does not include an enabled PGDG source.
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$RUNNER_TEMP/aurora-pgdg.asc"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$RUNNER_TEMP/aurora-pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
            "$(lsb_release -cs)" | sudo tee /etc/apt/sources.list.d/aurora-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-17 postgresql-client-17
          postgres_test_bin=/usr/lib/postgresql/17/bin
          for postgres_tool in initdb pg_ctl pg_dump pg_restore psql createdb; do
            test -x "$postgres_test_bin/$postgres_tool"
            postgres_tool_version="$("$postgres_test_bin/$postgres_tool" --version)"
            printf '%s\n' "$postgres_tool_version"
            [[ "$postgres_tool_version" == *" 17."* ]]
          done
          printf '%s\n' "$postgres_test_bin" >> "$GITHUB_PATH"

      - name: Create disposable integration databases
        run: |
          for database in \
            aurora_e2e_real \
            aurora_schema_gate_test \
            aurora_publication_gate_test \
            aurora_autopilot_cas_test \
            aurora_semantic_gate_test \
            aurora_ai_gate_test \
            aurora_audience_gate_test \
            aurora_password_gate_test \
            aurora_tracking_gate_test \
            aurora_s01_test \
            aurora_vk_authority_test \
            aurora_s02_test \
            aurora_s03_test \
            aurora_d02_test \
            aurora_d03_test \
            aurora_calendar_gate_test \
            aurora_sites_gate_test \
            aurora_media_quota_test \
            aurora_s02_restore_test \
            aurora_restore_source_test \
            aurora_media_lifecycle_test \
            aurora_capacity_test \
            aurora_oauth_context_test \
            aurora_publication_authority_test \
            aurora_adjacent_authority_test \
            aurora_admin_alert_test \
            aurora_destination_identity_test \
            aurora_rss_project_test \
            aurora_domain_review_test \
            aurora_legacy_content_test \
            aurora_sites_ai_auth_test \
            aurora_admin_resource_test \
            aurora_admin_system_test \
            aurora_operations_test \
            aurora_hosted_projection_test \
            aurora_native_media_test \
            aurora_sites_delivery_test \
            aurora_diagnostics_privacy_test \
            aurora_admin_access_recovery_test \
            aurora_admin_gate_test
          do
            createdb -h localhost -U postgres "$database"
          done
          createdb -h localhost -U postgres --template=template0 --encoding=UTF8 --lc-collate=C --lc-ctype=C aurora_export_filters_test
        env:
          PGPASSWORD: postgres

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Reject focused or skipped tests
        run: npm run test:focus

      - name: Check additive migrations
        run: npm run test:migrations

      - name: Test migrations on legacy PostgreSQL fixtures
        run: npm run test:migrations:integration

      - name: Test schema readiness and pre-consumer worker gate
        run: npm run test:schema-readiness:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_schema_gate_test"

      - name: Test overdue publication quarantine
        run: npm run test:publication-quarantine:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test Autopilot revision-bound confirmation
        run: npm run test:autopilot-confirmation:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_autopilot_cas_test"

      - name: Test semantic publication gate
        run: npm run test:semantic-publication:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_semantic_gate_test"

      - name: Test common AI orchestration and accounting
        run: npm run test:ai-orchestration:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_ai_gate_test"

      - name: Test audience reply delivery and recovery
        run: npm run test:audience-delivery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_audience_gate_test"

      - name: Test immutable publication operations and outbox
        run: npm run test:publication-operation:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test publication lifecycle and provider delivery
        run: npm run test:publication-lifecycle:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test project collaboration, permissions and approval races
        run: npm run test:project-collaboration:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test site-analysis tenant isolation
        run: npm run test:site-analysis-tenant:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test password recovery races and delivery outbox
        run: npm run test:password-recovery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_password_gate_test"

      - name: Content-free production diagnostic SQL export
        run: env -u DATABASE_URL npm run test:production-diagnostics-privacy:integration
        env:
          DIAGNOSTICS_PRIVACY_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_diagnostics_privacy_test"

      - name: Existing-admin recovery and one-use credential lifecycle
        run: env -u DATABASE_URL npm run test:admin-access-recovery:integration
        env:
          ADMIN_RECOVERY_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_access_recovery_test"

      - name: Test exact tracking attribution and conversion replay
        run: npm run test:tracking-lifecycle:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_tracking_gate_test"

      - name: Registration identity and transaction races
        run: env -u DATABASE_URL npm run test:registration:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Database pool acquisition deadline
        run: env -u DATABASE_URL npm run test:database-pool-timeout:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Database pool query and transaction monitoring
        run: env -u DATABASE_URL npm run test:db-pool:integration
        env:
          DATABASE_POOL_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_e2e_real"

      - name: Telegram actor ownership, replay and races
        run: env -u DATABASE_URL npm run test:telegram-ownership:integration
        env:
          TELEGRAM_OWNERSHIP_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_s01_test"

      - name: AI author and revoked membership
        run: env -u DATABASE_URL npm run test:ai-project-authorization:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_s03_test"

      - name: Calendar completeness and stable pagination
        run: env -u DATABASE_URL npm run test:calendar-pagination:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_calendar_gate_test"

      - name: Explicit project across concurrent requests
        run: env -u DATABASE_URL npm run test:project-request-context:integration
        env:
          PROJECT_CONTEXT_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_d02_test"

      - name: Actual paid AI attempts and cost caps
        run: env -u DATABASE_URL npm run test:ai-spend:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_d03_test"

      - name: Sites exact reviewed revision
        run: env -u DATABASE_URL npm run test:sites-revision:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_sites_gate_test"

      - name: Durable Telegram unknown and multipart delivery
        run: env -u DATABASE_URL npm run test:telegram-delivery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_s02_test"

      - name: Atomic media byte quotas
        run: env -u DATABASE_URL npm run test:media-quota:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_media_quota_test"

      - name: Scrub final SDK telemetry envelopes with tracing on and off
        run: npm run test:telemetry-envelope

      - name: Media lifecycle and orphan cleanup
        run: env -u DATABASE_URL npm run test:media-lifecycle:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_media_lifecycle_test"

      - name: Calendar load and claim saturation
        run: env -u DATABASE_URL npm run test:capacity:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_capacity_test"

      - name: Admin operations on fresh migrated schema
        run: env -u DATABASE_URL npm run test:admin-operations:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_gate_test"

      - name: Verified admin alert recipient identity
        run: env -u DATABASE_URL npm run test:admin-alert-recipient:integration
        env:
          ADMIN_ALERT_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_gate_test"

      - name: Restore rehearsal with outbound held and receipt quarantine
        run: env -u DATABASE_URL npm run test:restored-publications:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_restore_source_test"
          RESTORE_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_s02_restore_test"
          AURORA_OUTBOUND_DISABLED: "1"

      - name: Sites destination receipts and parallel delivery
        run: env -u DATABASE_URL npm run test:sites-delivery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_sites_delivery_test"

      - name: Native media and export project access after revoke
        run: env -u DATABASE_URL npm run test:native-project-media:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_native_media_test"

      - name: Hosted content follows its own exact confirmed revision
        run: env -u DATABASE_URL npm run test:hosted-projection:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_hosted_projection_test"

      - name: Content-free operational snapshot and incident transitions
        run: env -u DATABASE_URL npm run test:runtime-operations:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_operations_test"

      - name: OAuth project ownership and callback races
        run: env -u DATABASE_URL npm run test:oauth-project-context:integration
        env:
          PROJECT_CONTEXT_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_oauth_context_test"

      - name: Current authority at every publication boundary
        run: env -u DATABASE_URL npm run test:publication-authority:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_authority_test"

      - name: Sites and follow-up publication authority
        run: env -u DATABASE_URL npm run test:publication-adjacent-authority:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_adjacent_authority_test"

      - name: Durable per-recipient operational alert delivery
        run: env -u DATABASE_URL npm run test:admin-alert-delivery:integration
        env:
          ADMIN_ALERT_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_alert_test"

      - name: Destination identity stays bound to existing publication receipts
        run: env -u DATABASE_URL npm run test:site-destination-identity:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_destination_identity_test"

      - name: RSS explicit identity and worker revoke
        run: env -u DATABASE_URL npm run test:rss-project-authorization:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_rss_project_test"

      - name: Research domains current project and role
        run: env -u DATABASE_URL npm run test:research-project-access:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_domain_review_test"

      - name: Legacy content and profile scope after revoke
        run: env -u DATABASE_URL npm run test:legacy-content-project:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_legacy_content_test"

      - name: Sites AI current access for local and paid engines
        run: env -u DATABASE_URL npm run test:sites-ai-current-access:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_sites_ai_auth_test"

      - name: Admin resource routes exact session and access policy
        run: env -u DATABASE_URL npm run test:admin-resource-auth:integration
        env:
          ADMIN_RESOURCE_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_resource_test"

      - name: Admin system diagnostics on the actual schema
        run: env -u DATABASE_URL -u REDIS_URL npm run test:admin-system-integrity:integration
        env:
          SYSTEM_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_admin_system_test"
          SYSTEM_TEST_REDIS_URL: "redis://127.0.0.1:6380/13"

      - name: Admin queue diagnostics with actual execution and recovery
        run: env -u DATABASE_URL -u REDIS_URL npm run test:admin-system-queues:integration
        env:
          SYSTEM_TEST_REDIS_URL: "redis://127.0.0.1:6380/8"

      - name: Queue worker readiness respects the actual Redis database
        run: env -u DATABASE_URL -u REDIS_URL npm run test:queue-worker-availability:integration
        env:
          QUEUE_WORKER_TEST_REDIS_URL: "redis://127.0.0.1:6380/12"

      - name: Project export filters on a C-locale database
        run: env -u DATABASE_URL -u REDIS_URL npm run test:project-export-filters:integration
        env:
          PROJECT_EXPORT_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_export_filters_test"

      - name: VK connection authority and persisted credential owner
        run: env -u DATABASE_URL -u REDIS_URL npm run test:vk-connection-authority:integration
        env:
          VK_AUTHORITY_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_vk_authority_test"

      - name: Production build 1
        run: npm run build

      - name: Production build 2
        run: npm run build

      - name: Check worker syntax
        run: |
          node --check worker.mjs
          find worker -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Test
        run: npm test

      - name: Test critical journey contracts
        run: npm run test:contracts

      - name: Install deterministic browsers
        run: npx playwright-core install --with-deps chromium firefox webkit

      - name: Browser body failure classification and project isolation
        run: npm run test:project-fetch:browser

      - name: Test production Trends hydration
        run: npm run test:trends-hydration:e2e

      - name: Real critical E2E in three engines
        run: |
          E2E_BROWSER=chromium E2E_BUILD_MODE=build npm run test:e2e:real
          for browser in firefox webkit
          do
            E2E_BROWSER="$browser" E2E_BUILD_MODE=reuse npm run test:e2e:real
          done

      - name: Upload real-E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-failure
          path: test-results/e2e-real
          if-no-files-found: ignore
