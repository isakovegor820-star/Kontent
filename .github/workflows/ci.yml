# Every candidate keeps the complete test coverage; independent jobs run concurrently.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only obsolete PR runs are cancelled. Main candidates retain their exact-SHA evidence.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: "postgres://user:pass@localhost:5432/db"
  REDIS_URL: "redis://127.0.0.1:6380"
  TG_BOT_TOKEN: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  TG_BOT_USERNAME: "aurora_test_bot"
  TG_CHAT_ID: "-1000000000000"
  AI_API_KEY: "test-key"
  AI_DAILY_LIMIT: "30"
  MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_migration_test"
  E2E_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_e2e_real"
  E2E_REDIS_URL: "redis://127.0.0.1:6380/15"
  MIGRATION_TEST_REDIS_URL: "redis://127.0.0.1:6380/14"
  # Мастер-ключ шифрования токенов сообществ (VK). В CI — заглушка: тесты
  # token-crypto выставляют своё значение, а на сборке шифрование не вызывается.
  TOKENS_MASTER_KEY: "ci-test-master-key-not-for-prod"
  TOKENS_KEY_ID: "1"
  VK_APP_ID: "0"
  VK_APP_SECRET: "test-vk-secret"
  E2E_WEB_PORT: "43190"
  E2E_NEXT_PORT: "43191"
  E2E_FAKE_PORT: "43192"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurora_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install PDF verification utilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils

      - name: Create disposable integration databases
        run: |
          for database in \
            aurora_e2e_real \
            aurora_schema_gate_test \
            aurora_publication_gate_test \
            aurora_autopilot_cas_test \
            aurora_semantic_gate_test \
            aurora_ai_gate_test \
            aurora_audience_gate_test \
            aurora_password_gate_test \
            aurora_bot_persistence_test \
            aurora_tracking_gate_test \
            aurora_launch_test
          do
            createdb -h localhost -U postgres "$database"
          done
        env:
          PGPASSWORD: postgres

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Reject focused or skipped tests
        run: npm run test:focus

      - name: Check additive migrations
        run: npm run test:migrations

      - name: Test migrations on legacy PostgreSQL fixtures
        run: npm run test:migrations:integration

      - name: Test schema readiness and pre-consumer worker gate
        run: npm run test:schema-readiness:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_schema_gate_test"

      - name: Test overdue publication quarantine
        run: npm run test:publication-quarantine:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test Autopilot revision-bound confirmation
        run: npm run test:autopilot-confirmation:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_autopilot_cas_test"

      - name: Test semantic publication gate
        run: npm run test:semantic-publication:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_semantic_gate_test"

      - name: Test common AI orchestration and accounting
        run: npm run test:ai-orchestration:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_ai_gate_test"

      - name: Test audience reply delivery and recovery
        run: npm run test:audience-delivery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_audience_gate_test"

      - name: Test immutable publication operations and outbox
        run: npm run test:publication-operation:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test publication lifecycle and provider delivery
        run: npm run test:publication-lifecycle:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test project collaboration, permissions and approval races
        run: npm run test:project-collaboration:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test site-analysis tenant isolation
        run: npm run test:site-analysis-tenant:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_publication_gate_test"

      - name: Test password recovery races and delivery outbox
        run: npm run test:password-recovery:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_password_gate_test"

      - name: Test bot account persistence and connection races
        run: npm run test:bot-persistence:integration
        env:
          BOT_PERSISTENCE_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_bot_persistence_test"

      - name: Test exact tracking attribution and conversion replay
        run: npm run test:tracking-lifecycle:integration
        env:
          MIGRATION_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aurora_tracking_gate_test"

      - name: Test Studio and Sites recovery, accounting and analytics
        run: npx vitest run --config vitest.integration.config.ts src/e2e/studio-sites-review.integration.ts --maxWorkers=1
        env:
          STUDIO_SITES_TEST_POSTGRES_URL: "postgres://postgres:postgres@localhost:5432/postgres"
          STUDIO_SITES_TEST_REDIS_URL: "redis://127.0.0.1:6380"

      - name: Test knowledge indexing recovery and project access
        run: npx vitest run --config vitest.integration.config.ts src/e2e/knowledge-engine.integration.ts src/e2e/knowledge-access.integration.ts --maxWorkers=1
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/aurora_launch_test"

      - name: Production build
        run: npm run build

      - name: Check worker syntax
        run: |
          node --check worker.mjs
          find worker -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Test
        run: npm test

      - name: Test query-specific Trends datasets
        run: node scripts/test-trends-dashboard.mjs --sql-only
        env:
          TRENDS_QA_ADMIN_URL: "postgres://postgres:postgres@localhost:5432/postgres"

      - name: Test critical journey contracts
        run: npm run test:contracts


  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared E2E runtime
        run: npm run test:e2e:real -- --build-only

      - name: Pack shared E2E runtime
        run: tar --exclude='.next-e2e-real/cache' -czf e2e-runtime.tar.gz .next-e2e-real

      - name: Upload shared E2E runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runtime-${{ github.sha }}
          path: e2e-runtime.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_e2e_real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurora_e2e_real"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shared E2E runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: e2e-runtime-${{ github.sha }}

      - name: Unpack shared E2E runtime
        run: tar -xzf e2e-runtime.tar.gz

      - name: Install PDF and browser verification utilities
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
          npx playwright-core install --with-deps "$E2E_BROWSER"

      - name: Calendar return drag regression
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: npm run test:calendar-return:browser

      - name: Real critical E2E
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_BUILD_MODE: reuse
        run: npm run test:e2e:real

      - name: Upload real-E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-real-failure-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            test-results/e2e-real
            test-results/calendar-return
          if-no-files-found: ignore

  trends-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurora_e2e_real
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurora_e2e_real"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Test production Trends hydration
        run: npm run test:trends-hydration:e2e

  # Keep the existing required check name. Skipped/cancelled/failed dependencies
  # must make this check fail, including a skipped browser matrix after a build failure.
  build:
    if: always()
    needs: [checks, e2e-build, e2e, trends-hydration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required CI jobs
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.CI_RESULTS);
          const required = ['checks', 'e2e-build', 'e2e', 'trends-hydration'];
          const failures = required.filter(name => results[name]?.result !== 'success');
          if (failures.length) {
            console.error('Required CI jobs did not succeed:', failures.map(name => `${name}:${results[name]?.result ?? 'missing'}`).join(', '));
            process.exit(1);
          }
          console.log('All server, migration, build, hydration and three-browser checks passed.');
          NODE
