name: Firefox binding diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/firefox-binding-diagnostic.yml
      - scripts/test-firefox-binding-diagnostic.mjs

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps firefox
      - name: Compare original and isolated candidate with unchanged lifecycle assertions
        run: node scripts/test-firefox-binding-diagnostic.mjs
      - name: Preserve exact diagnostic outcomes even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firefox-binding-diagnostic-${{ github.run_id }}
          path: test-results/firefox-binding-diagnostic
          if-no-files-found: error
          retention-days: 14
