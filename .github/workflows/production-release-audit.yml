name: Production release audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_SSH_HOST_FINGERPRINT: ${{ secrets.PRODUCTION_SSH_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRODUCTION_SSH_KEY"
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          test -n "$PRODUCTION_SSH_HOST_FINGERPRINT"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bash scripts/verify-ssh-host-identity.sh \
            ~/.ssh/known_hosts \
            "$PRODUCTION_SSH_HOST" \
            "$PRODUCTION_SSH_HOST_FINGERPRINT"

      - name: Collect read-only release and migration audit
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_USER"
          audit_sql_b64="$(base64 < scripts/production-migration-ledger-audit.sql | tr -d '\n')"
          report_b64="$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "AURORA_AUDIT_SQL_B64=${audit_sql_b64} bash -s" <<'REMOTE' | base64 | tr -d '\n'
          set -Eeuo pipefail

          current_path="$(readlink -f /opt/aurora-current)"
          test -d "$current_path"
          current_sha="$(git -C "$current_path" rev-parse --verify HEAD)"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]

          web_state="$(systemctl is-active aurora-web.service || true)"
          worker_state="$(systemctl is-active aurora-worker.service || true)"
          [[ "$web_state" == "active" ]]
          [[ "$worker_state" == "active" ]]
          health_json="$(curl -fsS --max-time 5 http://127.0.0.1:3002/api/health | tr -d '\r\n')"
          test -n "$health_json"

          test -f "$current_path/.env.production"
          set -a
          # shellcheck disable=SC1090
          . "$current_path/.env.production"
          set +a
          test -n "${DATABASE_URL:-}"
          ledger_json="$(printf '%s' "$AURORA_AUDIT_SQL_B64" \
            | base64 --decode \
            | psql "$DATABASE_URL" -X --no-psqlrc --set=ON_ERROR_STOP=1 \
            | tr -d '\r\n')"
          test -n "$ledger_json"

          printf 'current_path=%s\n' "$current_path"
          printf 'current_sha=%s\n' "$current_sha"
          printf 'web_service=%s\n' "$web_state"
          printf 'worker_service=%s\n' "$worker_state"
          printf 'health=%s\n' "$health_json"
          printf 'ledger=%s\n' "$ledger_json"
          REMOTE
          )"

          test -n "$report_b64"
          echo "::notice title=Production release audit (base64)::${report_b64}"
