# Production deploy to the Aurora VPS.
# Credentials live in the GitHub environment `production`. Agents must trigger
# this workflow instead of asking the user for SSH access.
name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify required CI checks
        env:
          GH_TOKEN: ${{ github.token }}
          AURORA_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AURORA_REQUIRED_CI_CHECKS: ${{ vars.REQUIRED_CI_CHECKS }}
        run: |
          test -n "$AURORA_REQUIRED_CI_CHECKS"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${AURORA_DEPLOY_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/required-checks.json"
          node scripts/verify-required-ci-checks.mjs "${RUNNER_TEMP}/required-checks.json"

      - name: Verify current production readiness before deploy
        env:
          AURORA_DEPLOYMENT_SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AURORA_DEPLOYMENT_SMOKE_PROFILE: ${{ vars.ALLOW_DEGRADED_MAIL == 'true' && 'release' || 'full' }}
          AURORA_DEPLOYMENT_SMOKE_ALLOW_FORWARD_SCHEMA: "true"
          AURORA_READINESS_TOKEN: ${{ secrets.AURORA_READINESS_TOKEN }}
        run: npm run test:deployment-smoke

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_SSH_HOST_FINGERPRINT: ${{ secrets.PRODUCTION_SSH_HOST_FINGERPRINT }}
        run: |
          test -n "$PRODUCTION_SSH_KEY"
          test -n "$PRODUCTION_SSH_HOST"
          test -n "$PRODUCTION_SSH_KNOWN_HOSTS"
          test -n "$PRODUCTION_SSH_HOST_FINGERPRINT"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$PRODUCTION_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          bash scripts/verify-ssh-host-identity.sh \
            ~/.ssh/known_hosts \
            "$PRODUCTION_SSH_HOST" \
            "$PRODUCTION_SSH_HOST_FINGERPRINT"

      - name: Verify exact rollback boundary
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          AURORA_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AURORA_SCHEMA_ROLLBACK_AUDIT: ${{ vars.SCHEMA_ROLLBACK_AUDIT }}
        run: |
          test -n "$PRODUCTION_SSH_USER"
          current_sha="$(
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
              'current_path="$(readlink -f /opt/aurora-current)" && test -n "$current_path" && git -C "$current_path" rev-parse --verify HEAD'
          )"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the exact current production SHA" >&2
            exit 1
          fi
          expected="${current_sha}:${AURORA_DEPLOY_SHA}"
          [[ "$AURORA_SCHEMA_ROLLBACK_AUDIT" == "$expected" ]] || {
            echo "SCHEMA_ROLLBACK_AUDIT must equal the rehearsed current:target pair: $expected" >&2
            exit 1
          }

      - name: Build production release artifact
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          AURORA_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DATABASE_URL: "postgres://user:pass@localhost:5432/db"
          REDIS_URL: "redis://127.0.0.1:6380"
          TG_BOT_TOKEN: "0000000000:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          TG_BOT_USERNAME: "aurora_test_bot"
          TG_CHAT_ID: "-1000000000000"
          AI_API_KEY: "deploy-build-key"
          AI_DAILY_LIMIT: "30"
          TOKENS_MASTER_KEY: "deploy-build-master-key-not-for-production-runtime"
          TOKENS_KEY_ID: "1"
          VK_APP_ID: "0"
          VK_APP_SECRET: "deploy-build-vk-secret"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CI: "true"
        run: |
          test -n "$PRODUCTION_SSH_USER"
          test -n "$SENTRY_AUTH_TOKEN"
          [[ "$AURORA_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          build_env="${RUNNER_TEMP}/aurora-public-build.env"
          cleanup_build_env() {
            rm -f -- "$build_env"
          }
          trap cleanup_build_env EXIT
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            'current_path="$(readlink -f /opt/aurora-current)"; set -a; . "${current_path}/.env.production"; set +a; for name in NEXT_PUBLIC_AURORA_EXPERIMENTAL_ROUTES NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SENTRY_ENABLE_DEV NEXT_PUBLIC_SENTRY_ENVIRONMENT NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE NEXT_PUBLIC_TREND_REFERENCE_STUDIO; do printf "%s=%q\n" "$name" "${!name:-}"; done' \
            > "$build_env"
          chmod 600 "$build_env"
          set -a
          # shellcheck disable=SC1090
          . "$build_env"
          set +a
          npm ci --no-audit --no-fund
          npm run build
          [[ "$(git rev-parse --verify HEAD)" == "$AURORA_DEPLOY_SHA" ]]
          git bundle create "${RUNNER_TEMP}/aurora-source-${AURORA_DEPLOY_SHA}.bundle" HEAD
          git bundle verify "${RUNNER_TEMP}/aurora-source-${AURORA_DEPLOY_SHA}.bundle"
          tar --exclude='.next/cache' \
            -czf "${RUNNER_TEMP}/aurora-build-${AURORA_DEPLOY_SHA}.tar.gz" \
            .next

      - name: Deploy release
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          AURORA_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AURORA_SCHEMA_ROLLBACK_AUDIT: ${{ vars.SCHEMA_ROLLBACK_AUDIT }}
          AURORA_ALLOW_LOCAL_PEER_MIGRATIONS: ${{ vars.ALLOW_LOCAL_PEER_MIGRATIONS }}
          AURORA_INCOMPLETE_RELEASE_SHA: ${{ vars.INCOMPLETE_RELEASE_SHA }}
          AURORA_AVATAR_BODY_LIMIT_BYTES: ${{ vars.AVATAR_BODY_LIMIT_BYTES }}
          AURORA_DB_POOL_MAX_WEB: ${{ vars.DB_POOL_MAX_WEB }}
          AURORA_DB_POOL_MAX_WORKER: ${{ vars.DB_POOL_MAX_WORKER }}
          AURORA_AI_SERVICE_ENGINE: ${{ vars.AI_SERVICE_ENGINE }}
          AURORA_AI_FALLBACK_ENGINES: ${{ vars.AI_FALLBACK_ENGINES }}
          AURORA_AI_SEMANTIC_ENGINE: ${{ vars.AI_SEMANTIC_ENGINE }}
          AURORA_AI_SEMANTIC_FALLBACK_ENGINES: ${{ vars.AI_SEMANTIC_FALLBACK_ENGINES }}
        run: |
          test -n "$PRODUCTION_SSH_USER"
          [[ "$AURORA_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$AURORA_SCHEMA_ROLLBACK_AUDIT" \
            && ! "$AURORA_SCHEMA_ROLLBACK_AUDIT" =~ ^[0-9a-f]{40}:[0-9a-f]{40}$ ]]; then
            echo "SCHEMA_ROLLBACK_AUDIT must be an exact previous:target SHA pair" >&2
            exit 1
          fi
          if [[ "$AURORA_ALLOW_LOCAL_PEER_MIGRATIONS" != "true" \
            && "$AURORA_ALLOW_LOCAL_PEER_MIGRATIONS" != "false" ]]; then
            echo "ALLOW_LOCAL_PEER_MIGRATIONS must be true or false" >&2
            exit 1
          fi
          for pool_max in "$AURORA_DB_POOL_MAX_WEB" "$AURORA_DB_POOL_MAX_WORKER"; do
            if [[ ! "$pool_max" =~ ^[0-9]+$ ]] || (( pool_max < 1 || pool_max > 100 )); then
              echo "DB pool limits must be integers between 1 and 100" >&2
              exit 1
            fi
          done
          # These are interpolated into the remote command line below, so they are held to
          # the engine-id charset here as well as inside the deploy script.
          for engine_id in "$AURORA_AI_SERVICE_ENGINE" "$AURORA_AI_SEMANTIC_ENGINE"; do
            if [[ -n "$engine_id" && ! "$engine_id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "AI_SERVICE_ENGINE and AI_SEMANTIC_ENGINE must be single engine ids" >&2
              exit 1
            fi
          done
          for engine_list in "$AURORA_AI_FALLBACK_ENGINES" "$AURORA_AI_SEMANTIC_FALLBACK_ENGINES"; do
            if [[ -n "$engine_list" && ! "$engine_list" =~ ^[a-z0-9][a-z0-9,-]*$ ]]; then
              echo "AI_FALLBACK_ENGINES and AI_SEMANTIC_FALLBACK_ENGINES must be comma-separated engine ids" >&2
              exit 1
            fi
          done
          build_archive="${RUNNER_TEMP}/aurora-build-${AURORA_DEPLOY_SHA}.tar.gz"
          remote_archive="/tmp/aurora-build-${AURORA_DEPLOY_SHA}.tar.gz"
          source_bundle="${RUNNER_TEMP}/aurora-source-${AURORA_DEPLOY_SHA}.bundle"
          remote_source_bundle="/tmp/aurora-source-${AURORA_DEPLOY_SHA}.bundle"
          test -f "$build_archive"
          test -f "$source_bundle"
          build_archive_sha256="$(sha256sum "$build_archive" | cut -d ' ' -f1)"
          source_bundle_sha256="$(sha256sum "$source_bundle" | cut -d ' ' -f1)"
          cleanup_remote_archive() {
            ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
              "rm -f -- ${remote_archive} ${remote_source_bundle}" || true
          }
          trap cleanup_remote_archive EXIT
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$build_archive" \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}:${remote_archive}"
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$source_bundle" \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}:${remote_source_bundle}"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "AURORA_DEPLOY_SHA=${AURORA_DEPLOY_SHA} AURORA_SCHEMA_ROLLBACK_AUDIT=${AURORA_SCHEMA_ROLLBACK_AUDIT} AURORA_ALLOW_LOCAL_PEER_MIGRATIONS=${AURORA_ALLOW_LOCAL_PEER_MIGRATIONS} AURORA_INCOMPLETE_RELEASE_SHA=${AURORA_INCOMPLETE_RELEASE_SHA} AURORA_AVATAR_BODY_LIMIT_BYTES=${AURORA_AVATAR_BODY_LIMIT_BYTES} AURORA_DB_POOL_MAX_WEB=${AURORA_DB_POOL_MAX_WEB} AURORA_DB_POOL_MAX_WORKER=${AURORA_DB_POOL_MAX_WORKER} AURORA_AI_SERVICE_ENGINE=${AURORA_AI_SERVICE_ENGINE} AURORA_AI_FALLBACK_ENGINES=${AURORA_AI_FALLBACK_ENGINES} AURORA_AI_SEMANTIC_ENGINE=${AURORA_AI_SEMANTIC_ENGINE} AURORA_AI_SEMANTIC_FALLBACK_ENGINES=${AURORA_AI_SEMANTIC_FALLBACK_ENGINES} AURORA_BUILD_ARCHIVE=${remote_archive} AURORA_BUILD_ARCHIVE_SHA256=${build_archive_sha256} AURORA_SOURCE_BUNDLE=${remote_source_bundle} AURORA_SOURCE_BUNDLE_SHA256=${source_bundle_sha256} bash -s" \
            < scripts/deploy-production.sh

      - name: Verify production deployment
        env:
          AURORA_DEPLOYMENT_SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AURORA_DEPLOYMENT_SMOKE_PROFILE: ${{ vars.ALLOW_DEGRADED_MAIL == 'true' && 'release' || 'full' }}
          AURORA_READINESS_TOKEN: ${{ secrets.AURORA_READINESS_TOKEN }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          AURORA_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          smoke_attempts=12
          for attempt in $(seq 1 "$smoke_attempts"); do
            if npm run test:deployment-smoke; then
              exit 0
            fi
            if [[ "$attempt" -lt "$smoke_attempts" ]]; then
              echo "release readiness has not converged (attempt ${attempt}/${smoke_attempts}); retrying" >&2
              sleep 5
            fi
          done
          echo "release smoke failed; initiating schema-boundary-verified rollback" >&2
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "${PRODUCTION_SSH_USER}@${PRODUCTION_SSH_HOST}" \
            "AURORA_DEPLOY_ACTION=rollback AURORA_DEPLOY_SHA=${AURORA_DEPLOY_SHA} bash -s" \
            < scripts/deploy-production.sh
          exit 1
