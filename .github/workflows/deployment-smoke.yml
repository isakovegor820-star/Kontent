name: Production deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AURORA_DEPLOYMENT_SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      AURORA_DEPLOYMENT_SMOKE_PROFILE: full
      AURORA_READINESS_TOKEN: ${{ secrets.AURORA_READINESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify production deployment
        run: npm run test:deployment-smoke
