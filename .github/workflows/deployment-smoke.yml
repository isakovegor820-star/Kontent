name: Production deployment smoke

# Ручной и ежедневный read-only контроль прода.
#
# Профиль обязан повторять логику деплоя (deploy-production.yml): при
# ALLOW_DEGRADED_MAIL=true почта осознанно деградирована, и профиль full требует
# mailDeliveryReady, которого нет. Из-за жёсткого `full` этот воркфлоу падал во всех
# 22 прогонах с 18.08.2026 — постоянный сторож прода был красным по умолчанию, и
# настоящая авария в нём не отличалась от шума.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: production-deployment-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AURORA_DEPLOYMENT_SMOKE_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      AURORA_DEPLOYMENT_SMOKE_PROFILE: ${{ vars.ALLOW_DEGRADED_MAIL == 'true' && 'release' || 'full' }}
      AURORA_READINESS_TOKEN: ${{ secrets.AURORA_READINESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify production deployment
        run: npm run test:deployment-smoke
